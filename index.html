<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Random Photos</title>
<style>
  *{-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#ddd;font:15px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none}
  #stage{position:fixed;inset:0;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  #zoomer{will-change:transform;transform-origin:50% 50%}
  #zoomer.anim{transition:transform .25s ease}
  #img{max-width:100vw;max-height:100dvh;object-fit:contain;transition:transform .2s ease,opacity .2s ease}
  #bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000c);display:flex;flex-direction:column;gap:8px;align-items:stretch;transition:opacity .3s}
  #bar.hide{opacity:0;pointer-events:none}
  #btns{display:flex;justify-content:space-between;gap:6px}
  #btns .btn{flex:1;max-width:76px}
  .btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
  #fav.on svg{fill:#ff5a7a;stroke:#ff5a7a}
  #caption{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #caption a{color:#8cf;text-decoration:none}
  .btn{background:#ffffff22;color:#fff;border:0;border-radius:24px;min-width:48px;height:48px;font-size:20px;cursor:pointer}
  #status{position:fixed;top:calc(8px + env(safe-area-inset-top));left:12px;right:12px;font-size:12px;color:#fa8;pointer-events:none}
  #panel{position:fixed;left:0;right:0;bottom:0;max-height:90dvh;overflow:auto;background:#1b1b1b;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;display:none;z-index:10;touch-action:pan-y;user-select:text}
  #panel label{display:block;margin:12px 0 4px;font-size:13px;color:#aaa}
  #panel input,#panel textarea{width:100%;box-sizing:border-box;background:#000;color:#eee;border:1px solid #444;border-radius:8px;padding:10px;font-size:16px}
  #panel .row{display:flex;gap:8px;margin-top:14px}
  #panel .row button{flex:1;height:48px;border-radius:8px;border:0;font-size:16px;color:#fff;background:#356}
  #panel .row button.sec{background:#333}
  #hint{font-size:12px;color:#888;margin-top:10px}
  #favs{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;touch-action:pan-y}
  #favhead{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#111;flex-wrap:wrap}
  #favhead .sp{flex:1}
  .tb{background:#333;color:#fff;border:0;border-radius:8px;height:40px;padding:0 12px;font-size:14px}
  .tb.pri{background:#356}
  #favgrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:3px;padding:3px;align-content:start}
  .cell{position:relative;aspect-ratio:1;background:#222;overflow:hidden}
  .cell img{width:100%;height:100%;object-fit:cover;display:block}
  .cell .x{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:16px;background:#000a;color:#fff;border:0;font-size:15px}
  #toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;max-width:90vw;text-align:center}
  #toast.on{opacity:1}

  /* ---- desktop (mouse + keyboard) ---- */
  .nav{display:none}
  @media (hover:hover) and (pointer:fine){
    .btn{transition:background .15s}
    .btn:hover{background:#ffffff44}
    #bar{align-items:center;padding:16px 24px 20px}
    #caption{max-width:min(900px,90vw);text-align:center;font-size:14px}
    #btns{justify-content:center;gap:12px;width:auto}
    #btns .btn{flex:none;width:52px;max-width:none}
    #stage.zoomed{cursor:grab}
    #stage.zoomed.dragging{cursor:grabbing}
    .nav{display:flex;position:fixed;top:0;bottom:110px;width:14vw;max-width:170px;align-items:center;border:0;background:none;color:#fff;font-size:64px;line-height:1;opacity:0;cursor:pointer;transition:opacity .2s;z-index:5;padding:0 18px}
    #navprev{left:0;justify-content:flex-start}
    #navnext{right:0;justify-content:flex-end}
    .nav{text-shadow:0 0 6px #000,0 0 14px #000}
    .nav:hover{opacity:1}
    body.zoomed .nav{display:none}
    body.idle #bar,body.idle .nav{opacity:0;pointer-events:none}
    body.idle #stage{cursor:none}
    #panel{left:50%;right:auto;top:50%;bottom:auto;transform:translate(-50%,-50%);width:min(520px,92vw);border-radius:16px;max-height:86vh;box-shadow:0 12px 48px #000}
    #favgrid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;padding:6px}
    .cell{cursor:pointer}
    .tb{cursor:pointer}
    .tb:hover{background:#4a4a4a}.tb.pri:hover{background:#468}
  }
</style>
</head>
<body>
<div id="stage"><div id="zoomer"><img id="img" alt="" draggable="false"></div></div>
<div id="status"></div>
<button class="nav" id="navprev" aria-label="Previous photo">‹</button>
<button class="nav" id="navnext" aria-label="Next photo">›</button>
<div id="bar">
  <div id="caption"></div>
  <div id="btns">
    <button class="btn" id="fav" aria-label="Favorite"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
    <button class="btn" id="dl" aria-label="Download image"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
    <button class="btn" id="favlist" aria-label="Favorites list"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
    <button class="btn" id="fs" aria-label="Full screen">⛶</button>
    <button class="btn" id="play" aria-label="Play or pause">⏸</button>
    <button class="btn" id="gear" aria-label="Settings">⚙</button>
  </div>
</div>

<div id="panel">
  <label for="key">Tumblr API consumer key (free at tumblr.com/oauth/apps)</label>
  <input id="key" autocomplete="off" autocapitalize="off" spellcheck="false">
  <label for="blogs">Blogs, one per line (e.g. staff or foo.tumblr.com)</label>
  <textarea id="blogs" rows="6" autocapitalize="off" spellcheck="false"></textarea>
  <label for="secs">Auto-advance seconds (0 = manual only)</label>
  <input id="secs" type="number" inputmode="numeric" min="0" value="8">
  <div class="row"><button class="sec" id="cancel">Close</button><button id="save">Save &amp; start</button></div>
  <div id="hint">Swipe left/right for next/previous. Heart saves a favorite, the arrow downloads the image, the grid opens your favorites. Pinch to zoom, drag to pan when zoomed, double-tap to zoom in/out. Tap the photo to show/hide controls. Swipe up opens the original post.</div>
</div>

<div id="favs">
  <div id="favhead">
    <button class="tb" id="favclose">Close</button>
    <span id="favcount"></span>
    <span class="sp"></span>
    <button class="tb pri" id="favshuffle">Shuffle play</button>
    <button class="tb" id="favrandom">Back to random</button>
  </div>
  <div id="favgrid"></div>
</div>
<div id="toast"></div>

<script>
const API = "https://api.tumblr.com/v2/blog/";
const $ = id => document.getElementById(id);
const cfg = JSON.parse(localStorage.getItem("trp") || "{}");
let timer = null, paused = false, wake = null;
const totals = {}, queue = [], seen = new Set(), history = [];
let pos = -1, loading = false;
const fine = matchMedia("(hover:hover) and (pointer:fine)");   // mouse-and-keyboard device
let mode = "random", list = [], fi = 0, curItem = null;   // mode: random | favs
const loadFavs = () => { try { return JSON.parse(localStorage.getItem("trp_favs") || "[]"); } catch { return []; } };
let favs = loadFavs();
let toastT;
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400); }
const saveFavs = () => { try { localStorage.setItem("trp_favs", JSON.stringify(favs)); } catch { toast("Couldn't save (storage full?)"); } };
const isFav = k => favs.some(f => f.key === k);
function updateHeart() { $("fav").classList.toggle("on", !!curItem && isFav(curItem.key)); }

$("key").value = cfg.key || "";
$("blogs").value = (cfg.blogs || []).join("\n");
$("secs").value = cfg.secs ?? 8;

function jsonp(url) {
  return new Promise((res, rej) => {
    const cb = "cb" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    window[cb] = d => { delete window[cb]; s.remove(); res(d); };
    s.onerror = () => { s.remove(); rej(new Error("Network error")); };
    s.src = url + "&callback=" + cb;
    document.head.appendChild(s);
  });
}
async function call(blog, params) {
  const q = new URLSearchParams({ api_key: cfg.key, ...params });
  const url = `${API}${blog}/posts/photo?${q}`;
  let data;
  try { data = await (await fetch(url)).json(); } catch { data = await jsonp(url); }
  if (data.meta && data.meta.status !== 200) throw new Error(`${blog}: ${data.meta.msg}`);
  return data.response;
}
const normBlog = b => { b = b.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, ""); return b.includes(".") ? b : b + ".tumblr.com"; };

async function refill() {
  if (loading) return; loading = true;
  const blogs = cfg.blogs.map(normBlog);
  const blog = blogs[Math.floor(Math.random() * blogs.length)];
  try {
    if (totals[blog] === undefined) totals[blog] = (await call(blog, { limit: 1 })).total_posts || 0;
    const total = totals[blog];
    if (!total) { $("status").textContent = `${blog}: no photo posts`; return; }
    const limit = 20;
    const offset = Math.floor(Math.random() * Math.max(1, total - limit + 1));
    const r = await call(blog, { limit, offset });
    const items = [];
    for (const p of r.posts) for (const ph of (p.photos || [])) {
      // use a ~1280px size to save mobile data; fall back to original
      const alt = (ph.alt_sizes || []).find(a => a.width <= 1280) || ph.original_size;
      if (!seen.has(ph.original_size.url)) items.push({ key: ph.original_size.url, url: fine.matches ? ph.original_size.url : alt.url, thumb: ((ph.alt_sizes || []).find(a => a.width <= 400) || alt).url, post: p.post_url, blog: p.blog_name, summary: p.summary || "" });
    }
    items.sort(() => Math.random() - 0.5);
    queue.push(...items);
    $("status").textContent = "";
  } catch (e) { $("status").textContent = e.message; }
  finally { loading = false; }
}

function show(it, dir = 0) {
  resetZoom(false);
  curItem = it; updateHeart();
  const img = $("img");
  img.style.opacity = 0; img.style.transform = `translateX(${dir * 40}px)`;
  setTimeout(() => {
    img.src = it.url;
    img.onload = () => { img.style.transform = "none"; img.style.opacity = 1; };
    $("caption").innerHTML = (mode === "favs" ? `♥ ${fi + 1}/${list.length} · ` : "") + `<a href="${it.post}" target="_blank" rel="noopener">${it.blog}</a> ${it.summary.slice(0, 100).replace(/</g, "&lt;")}`;
  }, 120);
}
async function next() {
  if (mode === "favs") { if (!list.length) return; fi = (fi + 1) % list.length; return show(list[fi], -1); }
  if (pos < history.length - 1) { pos++; return show(history[pos], -1); }
  if (queue.length < 4) await refill();
  const it = queue.shift();
  if (!it) return;
  seen.add(it.key); history.push(it); if (history.length > 200) { history.shift(); } pos = history.length - 1;
  show(it, -1);
  if (queue.length < 8) refill();
  if (queue[0]) new Image().src = queue[0].url;
}
function prev() {
  if (mode === "favs") { if (!list.length) return; fi = (fi - 1 + list.length) % list.length; return show(list[fi], 1); }
  if (pos > 0) { pos--; show(history[pos], 1); }
}
function schedule() { clearInterval(timer); if (cfg.secs > 0 && !paused) timer = setInterval(() => { if (!zoomed()) next(); }, cfg.secs * 1000); }
async function keepAwake() { try { wake = await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

function start() {
  if (!cfg.key || !cfg.blogs?.length) return openPanel();
  mode = "random"; queue.length = 0; history.length = 0; pos = -1;
  next(); schedule(); keepAwake();
}
function openPanel() { $("panel").style.display = "block"; clearInterval(timer); }
function closePanel() { $("panel").style.display = "none"; schedule(); }

$("save").onclick = () => {
  cfg.key = $("key").value.trim();
  cfg.blogs = $("blogs").value.split("\n").map(s => s.trim()).filter(Boolean);
  cfg.secs = +$("secs").value || 0;
  localStorage.setItem("trp", JSON.stringify(cfg));
  $("panel").style.display = "none"; start();
};
$("cancel").onclick = closePanel;
$("gear").onclick = openPanel;
$("play").onclick = () => { paused = !paused; $("play").textContent = paused ? "▶" : "⏸"; schedule(); };

// ---- zoom / pan / gestures ----
const MAX_Z = 6;
let Z = { s: 1, tx: 0, ty: 0 };
const zoomer = $("zoomer"), stage = $("stage");
const zoomed = () => Z.s > 1.02;
function applyZoom() {
  zoomer.style.transform = `translate(${Z.tx}px,${Z.ty}px) scale(${Z.s})`;
  const z = zoomed(); stage.classList.toggle("zoomed", z); document.body.classList.toggle("zoomed", z);
}
function clampPan(s = Z.s) {
  const img = $("img"), vw = innerWidth, vh = innerHeight;
  const mx = Math.max(0, (img.offsetWidth * s - vw) / 2), my = Math.max(0, (img.offsetHeight * s - vh) / 2);
  Z.tx = Math.min(mx, Math.max(-mx, Z.tx)); Z.ty = Math.min(my, Math.max(-my, Z.ty));
}
function resetZoom(animate = true) {
  zoomer.classList.toggle("anim", animate);
  Z = { s: 1, tx: 0, ty: 0 }; applyZoom();
}
// zoom to scale ns keeping the screen point (x,y) fixed
function zoomAt(ns, x, y, animate) {
  const fx = x - innerWidth / 2, fy = y - innerHeight / 2;
  zoomer.classList.toggle("anim", !!animate);
  Z.tx = fx - ns * (fx - Z.tx) / Z.s; Z.ty = fy - ns * (fy - Z.ty) / Z.s; Z.s = ns;
  clampPan(); applyZoom();
}

let sx, sy, g = null, lastTap = 0, tapTimer = null;
const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
const mid = (a, b) => ({ x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 });
function beginSingle(t) { sx = t.clientX; sy = t.clientY; g = { ...(g || {}), mode: "single", ptx: Z.tx, pty: Z.ty, multi: g?.multi || false, moved: g?.moved || false }; }

stage.addEventListener("touchstart", e => {
  zoomer.classList.remove("anim");
  if (e.touches.length >= 2) {
    const a = e.touches[0], b = e.touches[1], m = mid(a, b);
    g = { mode: "pinch", multi: true, moved: true, d0: dist(a, b), s0: Z.s, tx0: Z.tx, ty0: Z.ty, f0x: m.x - innerWidth / 2, f0y: m.y - innerHeight / 2 };
  } else {
    g = null; beginSingle(e.touches[0]);
  }
}, { passive: true });

stage.addEventListener("touchmove", e => {
  if (!g) return;
  if (g.mode === "pinch" && e.touches.length >= 2) {
    const a = e.touches[0], b = e.touches[1], m = mid(a, b);
    const ns = Math.min(MAX_Z, Math.max(0.7, g.s0 * dist(a, b) / g.d0));
    const fx = m.x - innerWidth / 2, fy = m.y - innerHeight / 2;
    Z.tx = fx - ns * (g.f0x - g.tx0) / g.s0; Z.ty = fy - ns * (g.f0y - g.ty0) / g.s0; Z.s = ns;
    if (ns >= 1) clampPan(); applyZoom();
  } else if (g.mode === "single" && zoomed()) {
    const t = e.touches[0];
    Z.tx = g.ptx + (t.clientX - sx); Z.ty = g.pty + (t.clientY - sy);
    g.moved = true; clampPan(); applyZoom();
  }
}, { passive: true });

stage.addEventListener("touchend", e => {
  const t = e.changedTouches[0];
  if (e.touches.length >= 1) {            // one finger left after a pinch: continue as pan
    if (g?.mode === "pinch") beginSingle(e.touches[0]);
    return;
  }
  const wasMulti = g?.multi, wasMoved = g?.moved;
  if (Z.s < 1) { zoomer.classList.add("anim"); Z = { s: 1, tx: 0, ty: 0 }; applyZoom(); }
  else { clampPan(); applyZoom(); }
  const dx = t.clientX - sx, dy = t.clientY - sy;
  g = null;
  if (wasMulti) return;
  if (zoomed()) { if (wasMoved) return; }   // finished a pan while zoomed
  else if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); schedule(); return; }
  else if (dy < -70 && Math.abs(dy) > Math.abs(dx)) { const it = history[pos]; if (it) window.open(it.post, "_blank"); return; }
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) {  // tap
    const now = Date.now();
    if (now - lastTap < 300) {                     // double tap: zoom in / back out
      clearTimeout(tapTimer); lastTap = 0;
      zoomed() ? resetZoom(true) : zoomAt(2.5, t.clientX, t.clientY, true);
    } else {
      lastTap = now;
      tapTimer = setTimeout(() => { lastTap = 0; $("bar").classList.toggle("hide"); }, 300);
    }
  }
}, { passive: true });
stage.addEventListener("touchcancel", () => { g = null; }, { passive: true });

// desktop: wheel / trackpad-pinch to zoom
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const ns = Math.min(MAX_Z, Math.max(1, Z.s * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015))));
  zoomAt(ns, e.clientX, e.clientY, false);
}, { passive: false });
$("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();

// ---- favorites + download ----
$("fav").onclick = () => {
  if (!curItem) return;
  if (isFav(curItem.key)) { favs = favs.filter(f => f.key !== curItem.key); toast("Removed from favorites"); }
  else {
    const { key, url, thumb, post, blog, summary } = curItem;
    favs.unshift({ key, url, thumb: thumb || url, post, blog, summary: (summary || "").slice(0, 200), t: Date.now() });
    toast("Added to favorites ♥");
  }
  saveFavs(); updateHeart(); navigator.vibrate?.(15);
};
function renderFavs() {
  const g = $("favgrid"); g.innerHTML = "";
  $("favcount").textContent = `${favs.length} favorite${favs.length === 1 ? "" : "s"}`;
  $("favshuffle").style.display = favs.length ? "" : "none";
  $("favrandom").style.display = mode === "favs" ? "" : "none";
  if (!favs.length) {
    g.style.display = "block";
    g.innerHTML = '<p style="padding:24px;color:#888;text-align:center">No favorites yet. Tap the heart on a photo to save it here.</p>';
    return;
  }
  g.style.display = "grid";
  favs.forEach((f, i) => {
    const c = document.createElement("div"); c.className = "cell";
    const im = document.createElement("img"); im.loading = "lazy"; im.alt = ""; im.src = f.thumb || f.url; c.appendChild(im);
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", "Remove favorite");
    x.onclick = ev => { ev.stopPropagation(); favs.splice(i, 1); saveFavs(); renderFavs(); updateHeart(); };
    c.appendChild(x);
    c.onclick = () => playFavs(i, false);
    g.appendChild(c);
  });
}
function openFavs() { clearInterval(timer); renderFavs(); $("favs").style.display = "flex"; }
function closeFavs() { $("favs").style.display = "none"; schedule(); }
function playFavs(i, shuffle) {
  if (!favs.length) return;
  list = favs.slice(); if (shuffle) list.sort(() => Math.random() - 0.5);
  mode = "favs"; fi = shuffle ? 0 : i;
  $("favs").style.display = "none";
  show(list[fi], -1); schedule();
}
function backToRandom() {
  mode = "random"; $("favs").style.display = "none";
  if (history[pos]) show(history[pos], 0); else start();
  schedule();
}
$("favlist").onclick = openFavs; $("favclose").onclick = closeFavs;
$("favshuffle").onclick = () => playFavs(0, true); $("favrandom").onclick = backToRandom;

async function download() {
  const it = curItem; if (!it) return;
  let base = (it.key.split("/").pop() || "").split("?")[0] || ("photo-" + Date.now());
  if (!/\.\w{2,4}$/.test(base)) base += ".jpg";
  const name = (it.blog || "tumblr").replace(/[^\w.-]/g, "_") + "_" + base;
  toast("Downloading…");
  try {
    const r = await fetch(it.key, { mode: "cors" });
    if (!r.ok) throw new Error(r.status);
    const u = URL.createObjectURL(await r.blob());
    const a = document.createElement("a"); a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 15000);
    toast("Download started");
  } catch {
    window.open(it.key, "_blank");
    toast("Opened the full image: press and hold it to save");
  }
}
$("dl").onclick = download;
// ---- desktop: mouse drag, double-click, keyboard, idle-hide ----
let lastPT = "touch", md = null;
stage.addEventListener("pointerdown", e => {
  lastPT = e.pointerType;
  if (e.pointerType !== "mouse" || e.button !== 0 || !zoomed()) return;
  md = { x: e.clientX, y: e.clientY, tx: Z.tx, ty: Z.ty };
  zoomer.classList.remove("anim");
  stage.setPointerCapture(e.pointerId); stage.classList.add("dragging");
});
stage.addEventListener("pointermove", e => {
  if (!md) return;
  Z.tx = md.tx + (e.clientX - md.x); Z.ty = md.ty + (e.clientY - md.y);
  clampPan(); applyZoom();
});
const endDrag = () => { md = null; stage.classList.remove("dragging"); };
stage.addEventListener("pointerup", endDrag); stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("dblclick", e => {
  if (lastPT !== "mouse") return;
  zoomed() ? resetZoom(true) : zoomAt(2.5, e.clientX, e.clientY, true);
});
$("navprev").onclick = () => { prev(); schedule(); };
$("navnext").onclick = () => { next(); schedule(); };
addEventListener("resize", () => { clampPan(); applyZoom(); });
// buttons shouldn't keep keyboard focus (Space would re-press them)
document.addEventListener("click", e => { const b = e.target.closest && e.target.closest("button"); if (b) b.blur(); });

const tips = { fav: "Favorite (H)", dl: "Download (D)", favlist: "Favorites (G)", fs: "Full screen (F)", play: "Play / pause (P)", gear: "Settings (S)" };
for (const k in tips) $(k).title = tips[k];
if (fine.matches) $("hint").innerHTML = "<b>Mouse:</b> wheel to zoom, drag to pan when zoomed, double-click to zoom in/out, side arrows for previous/next. <b>Keys:</b> \u2190 \u2192 / Space = previous/next \u00b7 H = favorite \u00b7 D = download \u00b7 G = favorites \u00b7 P = pause \u00b7 F = full screen \u00b7 S = settings \u00b7 + \u2212 0 = zoom \u00b7 Esc = close / reset zoom.";

const modalOpen = () => $("panel").style.display === "block" || $("favs").style.display === "flex";
function zoomBy(f) { zoomAt(Math.min(MAX_Z, Math.max(1, Z.s * f)), innerWidth / 2, innerHeight / 2, true); }
function panBy(dx, dy) { zoomer.classList.add("anim"); Z.tx += dx; Z.ty += dy; clampPan(); applyZoom(); }
addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;           // leave browser shortcuts (Ctrl+D etc.) alone
  const k = e.key;
  if (k === "Escape") {
    if ($("favs").style.display === "flex") closeFavs();
    else if ($("panel").style.display === "block") closePanel();
    else resetZoom(true);
    return;
  }
  if (e.target.matches("input,textarea") || modalOpen()) return;
  if (e.target.closest && e.target.closest("button") && (k === " " || k === "Enter")) return;
  const K = k.toLowerCase();
  if (k === "ArrowRight" || k === "ArrowLeft") {
    e.preventDefault();
    if (zoomed()) panBy(k === "ArrowRight" ? -120 : 120, 0);
    else { k === "ArrowRight" ? next() : prev(); schedule(); }
  } else if (k === "ArrowUp" || k === "ArrowDown") {
    if (zoomed()) { e.preventDefault(); panBy(0, k === "ArrowUp" ? 120 : -120); }
  } else if (k === " ") { e.preventDefault(); next(); schedule(); }
  else if (k === "0") resetZoom(true);
  else if (k === "+" || k === "=") zoomBy(1.4);
  else if (k === "-" || k === "_") zoomBy(1 / 1.4);
  else if (K === "h" || K === "l") $("fav").click();
  else if (K === "d") $("dl").click();
  else if (K === "g") $("favlist").click();
  else if (K === "s") $("gear").click();
  else if (K === "p") $("play").click();
  else if (K === "f") $("fs").click();
});

let idleT;
function wakeUI() {
  document.body.classList.remove("idle"); clearTimeout(idleT);
  if (!fine.matches) return;
  idleT = setTimeout(() => { if (!modalOpen() && !$("bar").matches(":hover")) document.body.classList.add("idle"); }, 3000);
}
addEventListener("pointermove", e => { if (e.pointerType === "mouse") wakeUI(); });
addEventListener("keydown", wakeUI);
wakeUI();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
start();
</script>
</body>
</html>
